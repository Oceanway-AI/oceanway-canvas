openapi: 3.0.3
info:
  title: OceanWay Studio HTTP API
  version: "1.0.0"
  description: 路径前缀为 /api，由 RegisterStudioAPI 注册当前支持的创作入口。身份、模型、资金和长期素材由 OceanWay
    Platform 校验。业务信封为 { code, data, msg, reason }。code 为 0
    表示成功，写请求必须携带当前身份版本与操作人。详细业务规则见 FS-STUDIO-001 及仓库 HTTP API 文档。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: skills
  - name: workbench
  - name: inspirations
    description: 灵感大厅上新（定时同步的上游中文提示词）
  - name: pose-library
    description: 站点姿势库：浏览、选用，管理员导入与图片同步
paths:
  /pose-library/poses:
    get:
      tags: [ pose-library ]
      summary: 按姿势分组浏览已启用且已同步的姿势
      parameters:
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: system, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: angle, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
          }
      responses:
        "200":
          {
            description: "data 含 poses（每个姿势带 items
              视角列表）、total、page、pageSize、facets（systems/categories/angles
              计数）；不含来源署名"
          }
        "401": { $ref: "#/components/responses/Error" }
  /pose-library/items/{id}/thumb:
    get:
      tags: [ pose-library ]
      summary: 读取姿势缩略图（本站数据目录）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: v, schema: { type: integer }, description: 同步版本号，仅用于缓存失效 }
      responses:
        "200": { description: 图片字节，Cache-Control private max-age=604800 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pose-library/items/{id}/image:
    get:
      tags: [ pose-library ]
      summary: 读取姿势原图（本站数据目录）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: v, schema: { type: integer } }
      responses:
        "200": { description: 图片字节 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /skills/presets:
    get:
      tags: [ canvas ]
      security: []
      summary: 获取公开场景技能预设目录
      responses:
        "200":
          description: 标准信封 data 为 presets 数组；预设只引用公开且启用的种子技能
        "500": { $ref: "#/components/responses/Error" }
  /skills/recommendations:
    get:
      tags: [ skills ]
      summary: 按行业列出推荐安装的内置技能
      responses:
        "200":
          {
            description: "标准信封 data 为 {industries, installedTotal}；每个行业含
              industryId、name、description、icon、installedCount 和
              skills（skillId、skillName、description、tag、reason、isAdded）。只读目录，不会自\
              动安装"
          }
        "401": { $ref: "#/components/responses/Error" }
  /skills/recommendations/{industryId}/install:
    parameters:
      - {
          in: path,
          name: industryId,
          required: true,
          description: 推荐行业 ID,
          schema: { type: string }
        }
    post:
      tags: [ skills ]
      summary: 把某个行业的推荐技能加入当前用户技能库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillIds:
                  type: array
                  maxItems: 12
                  items: { type: string }
                  description: 只安装其中这些技能；传 {} 或空数组时安装该行业全部推荐
      responses:
        "200":
          {
            description: "标准信封 data 为 {industryId, installed, skipped}；已安装、已删除或不在该行业推荐里的技能计入
              skipped，不报错"
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /skills:
    get:
      tags: [ skills ]
      summary: 列出技能；在个人技能视图按技能库分类筛选
      parameters:
        - {
            in: query,
            name: scope,
            schema: { type: string, enum: [ public, mine, created, favorites ], default: public }
          }
        - {
            in: query,
            name: libraryCategoryId,
            description: 用户技能库分类 ID，仅支持 mine 或 created 视图；与 libraryUncategorized 互斥,
            schema: { type: string }
          }
        - {
            in: query,
            name: libraryUncategorized,
            description: 仅列出未归类技能，仅支持 mine 或 created 视图；与 libraryCategoryId 互斥,
            schema: { type: boolean }
          }
      responses:
        "200":
          {
            description: 标准信封 data 为技能列表及分页信息；categories 含共享分类 value、label 和技能广场公开技能 count
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: 提交 /skills
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
      responses:
        "200":
          description: Studio 响应信封，业务数据按对应功能合同返回
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - data
                  - msg
                properties:
                  code:
                    type: integer
                  data: {}
                  msg:
                    type: string
                  reason:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /skills/library-categories:
    get:
      tags: [ skills ]
      summary: 获取当前用户可见的技能库分类和数量
      parameters:
        - {
            in: query,
            name: scope,
            schema: { type: string, enum: [ mine, created ], default: mine }
          }
      responses:
        "200":
          {
            description: 标准信封 data 为 categories、totalCount、uncategorizedCount；分类含
              id、name、scope、count
          }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [ skills ]
      summary: 创建个人或平台技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scope: { type: string, enum: [ personal, platform ], default: personal }
      responses:
        "200": { description: 标准信封 data.category 为新分类 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /skills/library-categories/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [ skills ]
      summary: 删除技能库分类并解除相关技能归类，不删除技能
      responses:
        "200": { description: "标准信封 data 为 {deleted: true}" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /skills/{id}/agent-mode:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string }
        }
    patch:
      tags: [ skills ]
      summary: 设置已安装技能是否进入 Agent 自动发现目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ mode ]
              properties:
                mode:
                  {
                    type: string,
                    enum: [ auto, manual ],
                    description: auto 进入技能目录由 Agent 按任务自动发现；manual 只在用户固定或点名时使用
                  }
      responses:
        "200": { description: 标准信封 data.skill 为更新后的技能 }
        "400": { description: mode 无效，或技能未安装（自建技能除外） }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: 技能不存在或对当前用户不可见 }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /skills/{id}/library-category:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string }
        }
    patch:
      tags: [ skills ]
      summary: 为当前用户已加入或自建的技能设置/清除技能库分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ categoryId ]
              properties:
                categoryId: { type: string, description: 个人分类或可见平台分类 ID；空字符串表示取消归类 }
      responses:
        "200": { description: 标准信封 data.skill 为更新后的技能 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /skills/{id}/files:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string }
        }
    put:
      tags: [ skills ]
      summary: 作者批量写入、重命名或删除技能包文本文件，并生成新的技能版本
      description: 按顺序应用 operations 后重建 ZIP 与文件清单；SKILL.md 变化时同步
        instruction。baseVersionId 必须等于当前版本，否则返回 409
        skill_version_conflict，details.currentVersionId 为最新版本。GitHub 技能返回 409
        failed_precondition。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ baseVersionId, operations ]
              properties:
                baseVersionId: { type: string, description: 编辑开始时读取到的 versionId }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [ op, path ]
                    properties:
                      op: { type: string, enum: [ write, rename, delete ] }
                      path: { type: string, description: 规范化相对路径，最多 8 层，不允许 .. / 绝对路径 / .git / 控制字符 }
                      to: { type: string, description: rename 的目标路径 }
                      content: { type: string, description: write 的 UTF-8 文本，单文件不超过 512KB }
      responses:
        "200": { description: 标准信封 data 为 skill、files 与 changed；内容未变化时 changed=false 且不生成版本 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
    get:
      summary: 读取 /skills/{id}/files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Studio 响应信封，业务数据按对应功能合同返回
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - data
                  - msg
                properties:
                  code:
                    type: integer
                  data: {}
                  msg:
                    type: string
                  reason:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /model-catalog:
    get:
      tags: [ models ]
      summary: 获取创作端模型目录
      description: |
        source=platform，模型、能力、价格和可用性来自 Platform 已发布目录。
        channelId 与 modelKey 用于现有创作控件选择，服务端按 Platform 目录重新验证。
        displayName、icon、channelLabel 和 description 是目录展示信息，执行权限和费用由 Platform 校验。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [ 0 ]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [ source, models, channels ]
                    properties:
                      source:
                        type: string
                        enum: [ system ]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  textWire:
                                    type: string
                                    enum: [ chat-completion, responses, claude-api ]
                                    description: 仅文本模型。按协议插件的 create.path 识别的请求格式，浏览器据此选择系统代理路径；识别不出时省略。
                                  tags:
                                    type: array
                                    maxItems: 5
                                    description: 后台模型创建及更新使用同名字段；文字去除首尾空白且不能重复，空数组清除标签，仅用于展示。
                                    items:
                                      type: object
                                      required: [ text, color ]
                                      properties:
                                        text:
                                          type: string
                                          minLength: 1
                                          maxLength: 12
                                        color:
                                          type: string
                                          enum: [ purple, blue, green, gold, orange, pink ]
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/summaries:
    get:
      tags: [ models ]
      summary: 分页读取当前账号的平台模型摘要
      description: 返回 source=platform、channels、catalogRevision、nextCursor、hasMore。摘要的
        platform.state=summary，包含展示、价格版本与变体参考摘要，完整参数通过详情读取。分页必须保持同一
        catalogRevision。响应使用 private, no-store。
      parameters:
        - { in: query, name: workspace_id, schema: { type: string } }
        - {
            in: query,
            name: model_type,
            schema: { type: string, enum: [ text, image, video, audio ] }
          }
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          }
      responses:
        "200":
          description: 当前页摘要，channels.models.platform 保留提供方扩展字段
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [ 0 ] }
                  data:
                    type: object
                    required: [ source, channels, catalogRevision ]
                    properties:
                      source: { type: string, enum: [ platform ] }
                      catalogRevision: { type: string }
                      nextCursor: { type: string }
                      hasMore: { type: boolean }
                      channels: { type: array, items: { type: object } }
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /model-catalog/detail:
    get:
      tags: [ models ]
      summary: 按三版本读取单型号详情
      description: 文本需要价格版本。媒体需要价格、能力与连接版本。省略 variant_id 返回该型号全部变体，指定则返回精确变体。响应
        data.model 为 PublicChannelModel，platform.state=detail。版本变化返回
        catalog_revision_conflict，需重新选择和预估。
      parameters:
        - { in: query, name: workspace_id, schema: { type: string } }
        - { in: query, name: model_name, required: true, schema: { type: string } }
        - { in: query, name: variant_id, schema: { type: string } }
        - {
            in: query,
            name: expected_price_version,
            required: true,
            schema: { type: string }
          }
        - { in: query, name: expected_capability_revision, schema: { type: string } }
        - {
            in: query,
            name: expected_connection_revision,
            schema: { type: integer, minimum: 1 }
          }
      responses:
        "200":
          description: 所选型号的完整执行参数与展示字段
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [ 0 ] }
                  data:
                    type: object
                    required: [ model ]
                    properties:
                      model: { type: object }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [ canvas ]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "304":
          description: If-None-Match 命中当前 revision，正文为空
        "404":
          description: 画布不存在或不属于当前用户
    delete:
      tags: [ canvas ]
      summary: 显式删除当前用户画布
      description: 删除后迟到的媒体回写和编辑操作不会重新创建画布；只有新的 create_canvas operation 可以显式创建同 ID 画布。
      responses:
        "200":
          description: 画布已删除，信封 data.id 返回画布 ID
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /canvas-projects/{id}/sync-status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [ canvas ]
      summary: 读取当前用户画布版本、输入租约及 Agent 占用状态
      description: 需要登录并拥有画布。仅返回 revision、服务端时间、有效租约和 Agent 控制字段，不返回 token、完整画布或 Agent
        对话正文；WebSocket 通知后校验状态，连接正常且无活动 Agent 时每三十秒补偿读取，断线或活动 Agent
        期间恢复前台两秒、后台十五秒非重叠查询。版本变化后再读取正文。
      responses:
        "200":
          description: 信封 data 含 revision、serverTime、leases 和可空的 agent；每项租约含
            nodeId、sessionId、expiresAt，agent 只含 runId、status、cleanupPending
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/realtime:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [ canvas ]
      summary: 建立画布多窗口光标、拖拽预览与同步通知 WebSocket
      description: 使用登录 Cookie，校验画布归属和 Origin。welcome 返回 selfId/peers，每个 peer 包含服务端分配的
        number（1–64），同一会话在各窗口编号一致且存续期间不变；Redis 模式跨实例分配并续期临时编号。客户端发送世界坐标
        presence，服务端广播 peer/leave/invalidate/heartbeat。光标与拖拽预览不入库，invalidate
        只在事务提交后发送，收到后通过 sync-status 校准。协议细节见画布操作同步专题。
      responses:
        "101":
          description: 已升级到 WebSocket
        "401":
          description: 未登录
        "403":
          description: 来源不允许
        "404":
          description: 画布不存在或不属于当前用户
        "503":
          description: 实时服务暂不可用，客户端保留 HTTP 同步
  /canvas-projects/{id}/edit-lease:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [ canvas ]
      summary: 获取、续期或释放节点文字编辑租约
      description: 需要登录并拥有画布。服务端有效期 30 秒，实际输入才获取；续期与释放必须携带当前 token。请求最大 2048
        字节，每用户每分钟最多 240 次；过期持有者不能影响新持有者。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ action, nodeId, sessionId ]
              properties:
                action:
                  type: string
                  enum: [ acquire, renew, release ]
                nodeId:
                  type: string
                  minLength: 1
                  maxLength: 160
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 160
                token:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: 信封 data 含 serverTime；获取及续期额外返回 lease 和 token，释放不返回 token
        "400":
          description: 参数无效
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
        "409":
          description: reason 为 canvas_edit_lease_conflict；节点被其他窗口占用或证明已过期
        "429":
          description: 请求超过频率限制
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /canvas-projects/{id}/operations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [ canvas ]
      summary: 按对象或字段变更写入画布
      description: |
        请求只提交对象级或字段级 operations，不提交整批画布快照。
        mutationId 是一次请求的幂等身份；响应丢失、断网、刷新或后台重试时必须复用同一个 mutationId 与原始 operations。
        更新、删除和连接操作要求目标存在并通过对象基线校验；同一字段冲突不会覆盖远端修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ mutationId, operations ]
              properties:
                mutationId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: 一次写入请求的幂等身份
                baseRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: 生成 operations 时已确认的画布 revision，用于诊断和响应
                editProofs:
                  type: array
                  maxItems: 500
                  description: 本次修改涉及节点的编辑证明，节点不可重复；不计入 mutation 摘要，原请求 receipt 可在租约过期后重放
                  items:
                    type: object
                    required: [ nodeId, sessionId, token ]
                    properties:
                      nodeId: { type: string, minLength: 1, maxLength: 160 }
                      sessionId: { type: string, minLength: 1, maxLength: 160 }
                      token: { type: string, minLength: 1, maxLength: 80 }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [ type ]
                    additionalProperties: true
                    description: create_canvas、create_node、patch_node、remove_node、create_connection、update_connection、remove_connection
                      或 set_field
      responses:
        "200":
          description: 信封 data.project 返回当前画布摘要，data.mutationId 返回原 mutationId
        "400":
          description: 请求、字段、对象基线或素材引用格式不合法
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户，且请求未包含显式 create_canvas
        "409":
          description: 对象并发冲突、同一 mutationId 对应的请求摘要不同或编辑证明失效（reason 为
            canvas_edit_lease_conflict）；原事务不会被覆盖
        "428":
          description: 缺少执行所需的对象基线
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /public/welcome:
    get:
      tags: [ meta ]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /agent/capabilities:
    get:
      tags: [ agent ]
      summary: 读取云端 Agent 能力
      responses:
        "200":
          description: 信封 data 包含
            version、permissionModes、contextScopes、skills、writeTools、billing、maxHistoryPairs、maxSteps、maxHistoryBytes、capabilitySetVersion、capabilitySetHash、nodeTypes、tools；maxHistoryPairs
            为跨轮保留的用户对话轮数，maxSteps 为 0 表示无固定模型调用上限，历史仍受 maxHistoryBytes 限制
  /agent/skills/usage:
    get:
      tags: [ agent ]
      summary: 读取当前用户技能的使用统计（由运行日志聚合，只读）
      responses:
        "200":
          description: 信封 data 含 scannedRuns、searchCalls 与按启用次数降序的 skills；每个技能含
            runsEnabled、searchHits、readCalls、readFailures、entryReads、cardReads 与
            topCards（最多 5 条最热卡路径）。统计仅覆盖调用方本人最近的运行，且不含任何技能正文
        "401":
          description: 未登录
  /agent/profile:
    get:
      tags: [ agent ]
      summary: 读取生效的用户、项目、画布 Agent 偏好层
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [ user, project, canvas ]
        - in: query
          name: projectId
          schema:
            type: string
        - in: query
          name: canvasId
          schema:
            type: string
      responses:
        "200":
          description: 信封 data 为合并 revision、hash 和按 user/project/canvas 顺序排列的
            layers；每层含独立数字 revision
        "403":
          description: 项目或画布不属于当前用户
    patch:
      tags: [ agent ]
      summary: 使用单层 revision CAS 更新 Agent 偏好
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileRequest"
      responses:
        "200":
          description: 返回更新后的生效偏好视图
        "409":
          description: 偏好 revision 已变化，须重新读取后保存
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/memory:
    get:
      tags: [ agent ]
      summary: 读取当前用户的 Agent 记忆文件
      responses:
        "200":
          {
            description: "标准信封 data 为 {mode, capacity, charCount, revision, entries,
              pendingCount, updatedAt}；entries 每条含 id、section（user|notes）、text"
          }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [ agent ]
      summary: 用户整体保存记忆文件（按 revision CAS）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ revision, entries ]
              properties:
                revision: { type: integer, format: int64, description: 读取时的 revision；不一致返回 409 }
                entries:
                  type: array
                  maxItems: 80
                  items:
                    type: object
                    required: [ section, text ]
                    properties:
                      id: { type: string, description: 保留原条目 ID；新条目留空 }
                      section: { type: string, enum: [ user, notes ] }
                      text: { type: string, description: 单条最多 400 字 }
      responses:
        "200": { description: 返回保存后的记忆文件；总量不得超过 capacity（5000 字），疑似密钥或敏感内容返回 400 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: 记忆文件已被 Agent 或其他页面修改，须重新读取 }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/memory/settings:
    patch:
      tags: [ agent ]
      summary: 设置记忆模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ mode ]
              properties:
                mode:
                  {
                    type: string,
                    enum: [ auto, review, off ],
                    description: auto 直接写入并可撤销；review 先暂存待确认；off 不注入也不提供写入工具
                  }
      responses:
        "200": { description: 返回更新后的记忆文件 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/memory/revisions:
    get:
      tags: [ agent ]
      summary: 列出记忆文件的修改记录
      parameters:
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [ applied, pending, rejected ] }
          }
        - {
            in: query,
            name: limit,
            description: 默认 50,
            schema: { type: integer, minimum: 1, maximum: 200 }
          }
      responses:
        "200":
          {
            description: "标准信封 data.revisions；每条含
              id、actor（agent|user|restore|seed|admin）、runId、status、summary、base\
              Revision、revision、changes、canUndo、createdAt"
          }
        "401": { $ref: "#/components/responses/Error" }
  /agent/memory/revisions/{revisionId}/undo:
    parameters:
      - { in: path, name: revisionId, required: true, schema: { type: string } }
    post:
      tags: [ agent ]
      summary: 撤销一次已生效的修改（恢复到修改前快照，并记一条 restore 修订）
      responses:
        "200": { description: 返回撤销后的记忆文件 }
        "400": { description: 修订未生效、已撤销或本身就是撤销；或撤销后会超过记忆容量 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: 这条修改涉及的条目之后又被改过，无法自动撤销 }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/memory/revisions/{revisionId}/decide:
    parameters:
      - { in: path, name: revisionId, required: true, schema: { type: string } }
    post:
      tags: [ agent ]
      summary: 采纳或拒绝 review 模式下的待确认修改
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ decision ]
              properties:
                decision: { type: string, enum: [ approve, reject ] }
      responses:
        "200": { description: 返回处理后的记忆文件 }
        "400": { description: decision 无效，或这条修改已经处理过 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: 记忆文件已在待确认修改之后变化，须重新查看 }
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/conversations:
    get:
      tags: [ agent ]
      summary: 读取当前用户在画布中参与的 Agent 对话
      description: 只读目录，不创建运行或调用模型。按最新轮 createdAt、id
        倒序；即使对话后来换绑画布，latestRunId、status、revision、cleanupPending
        仍来自该对话全局最新一轮。仅返回当前登录用户的记录，画布必须属于当前用户。
      parameters:
        - in: query
          name: canvasId
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: before
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为
            items（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）和可选
            nextCursor；没有记录时 items 为空数组
        "400":
          description: 画布 ID、limit 或分页游标无效
        "404":
          description: 画布不存在或不属于当前用户
  /agent/conversations/{id}:
    get:
      tags: [ agent ]
      summary: 读取单个 Agent 对话的最新轮次摘要
      description: 只读控制列，不载入事件。用于判断当前画布目录之外的已选对话是否变化；字段与目录项相同，latestRunId、status、revision、cleanupPending
        来自该对话全局最新一轮。仅返回当前登录用户的记录。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: 信封 data
            为单个目录项（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）
        "400":
          description: 会话 ID 无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/conversations/{id}/runs:
    get:
      tags: [ agent ]
      summary: 按时间顺序恢复当前用户的完整 Agent 对话轮次
      description: 仅返回当前用户、同一 conversationId 的不可变轮次，包含跨页面换绑画布后的轮次。按 createdAt、id
        升序分页；每轮默认带尾部事件窗口，完整事件使用运行详情 fromStart 和 sinceSeq 分页读取。读取不恢复执行或重复调用工具。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: after
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（与 data.run 相同的运行视图，含
            conversationId、userPrompt、idempotencyKey）和可选 nextCursor
        "400":
          description: 会话 ID、limit 或分页游标无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/runs:
    post:
      tags: [ agent ]
      summary: 创建一轮云端 Agent 任务
      description: 同一画布同时只允许一轮执行。排队、运行、等待审批及终态收尾均占用；服务端在创建任务和预留积分前以事务串行校验。浏览器断开不释放占用，同一轮幂等恢复不受影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run，包含新一轮
            id、conversationId、userPrompt、idempotencyKey、canvasId、status、permissionMode、model
            及时间
        "400":
          description: 参数、能力、模型或预算不符合要求，未创建任务
        "409":
          description: 幂等键已用于不同请求，或画布已有另一轮 Agent 占用。占用拒绝的 reason 为
            canvas_agent_busy，details 包含 canvasId 和
            agent（runId、status、cleanupPending），用于立即更新占用状态；未创建任务或预留积分，不自动重试。
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [ agent ]
      summary: 读取当前用户的 Agent 轮次
      description: data.run 只返回一页事件（默认最新 40 条）并带上
        eventSeqBase、eventCount、latestSeq、eventsTruncated：eventSeqBase
        是本次首条事件之前已入库的条数（不变量 events[i].seq == eventSeqBase + i + 1），latestSeq
        可直接作为下次 sinceSeq，eventsTruncated 表示还有更早的记录未随本次返回。读取走 (run_id, sequence)
        的 keyset 分页，不使用 offset；升级前把事件放在 state_json 里的轮次在事件表中没有行，读取回退到内存窗口。
      parameters:
        - in: query
          name: fromStart
          description: true 时从 sinceSeq 之后的首条事件开始读取（sinceSeq=0 时从 seq=1 开始）；省略时 sinceSeq=0
            仍返回默认尾部窗口。用于多端首次恢复完整历史，分页追平用 latestSeq 与 eventCount 判断。
          schema: { type: boolean, default: false }
        - in: query
          name: sinceSeq
          required: false
          description: 只返回该事件序号之后的事件（非负整数，单次最多 500 条）；追平或越界时返回空 events
          schema: { type: integer, minimum: 0 }
        - in: query
          name: eventLimit
          required: false
          description: 单次返回的事件条数上限，1–500，默认为尾部窗口大小
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: 信封 data.run（含 events 与 eventSeqBase / eventCount / latestSeq /
            eventsTruncated）
        "400":
          description: fromStart 不是布尔值，或 sinceSeq、eventLimit 不是整数或超出范围
        "404":
          description: 轮次不存在或不属于当前用户
  /agent/runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [ agent ]
      summary: 从服务端父轮历史创建新轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run（新的 ID）
        "409":
          description: 父轮仍在执行、幂等键冲突，或画布已有另一轮 Agent 占用。旧父轮已有后续轮次时 reason 为
            agent_conversation_stale_parent，客户端应同步最新历史，不能自动重发。原请求幂等回放优先于旧父轮检查。占用拒绝的
            reason 为 canvas_agent_busy，details 包含 canvasId 和
            agent（runId、status、cleanupPending），用于立即更新占用状态；不自动重试。
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}/interjections:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [ agent ]
      summary: 向正在运行的 Agent 轮次插入一句话
      description: 不新建轮次、不产生新的扣费身份。插话排进当前运行，在下一次模型调用前送达；同一 messageId 幂等。运行已结束返回
        409（reason=agent_interjection_run_finished），客户端把这条留在本机队列作为下一轮发送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ text, messageId ]
              properties:
                text:
                  type: string
                  maxLength: 4000
                messageId:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: 信封 data.accepted 与 data.pending
        "409":
          description: reason=agent_interjection_run_finished
            表示本轮已结束，改为下一轮发送；reason=agent_run_state_busy 表示运行状态并发写入冲突，可用同一
            messageId 重试
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}/interjections/{messageId}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 160
    delete:
      tags: [ agent ]
      summary: 撤回尚未送达模型的插话
      description: 只从待送队列移除并发出 user_interjection_withdrawn 事件；不停止本轮，也不取消已提交的生成任务。
      responses:
        "200":
          description: 信封 data.withdrawn
        "404":
          description: 插话不存在
        "409":
          description: reason=agent_interjection_already_delivered
            表示已送达模型或本轮已结束，不能撤回；reason=agent_run_state_busy 表示并发写入冲突，可重试
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [ agent ]
      summary: 取消当前用户的 Agent 轮次
      description: 停止 Agent 后续步骤并取消尚未提交上游的任务；已提交上游（可能已计费）的媒体任务继续完成并回写画布，收尾在其结束后完成。
      responses:
        "200":
          description: 信封 data.accepted
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [ agent ]
      summary: 撤销当前 Agent 运行产生的最新画布变更
      description: |
        仅撤销该运行最新一笔且当前完整画布哈希仍匹配的变更，不取消任务或退款。
        优先使用 canvas_updated.undo 中的原 runId/canvasId/stepId/expectedSnapshotHash；历史卡片不能改用最新运行ID。
        成功响应丢失可重放原请求，画布仍为撤销后快照时幂等确认；有后续新修改仍返回409。
        未保留完整快照、超过1MiB快照容量或已提交收费任务的变更不可撤销。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ expectedSnapshotHash ]
              properties:
                stepId:
                  type: string
                  maxLength: 160
                expectedSnapshotHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: "^[0-9a-fA-F]{64}$"
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: 信封 data.accepted 为 true 与当前 snapshotHash；相同原请求重试不会重复撤销
        "400":
          description: 请求无效、快照不可撤销或已提交任务不能撤销
        "409":
          description: 画布已发生后续变化，或 stepId 已不是该运行最新变更
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}/approvals/{approvalId}/decision:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [ agent ]
      summary: 提交 Agent 工具审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ decision ]
              properties:
                decision:
                  type: string
                  enum: [ approve, reject ]
                reason:
                  type: string
                  maxLength: 2000
                mediaSettings:
                  type: object
                  additionalProperties: false
                  description: 仅 approve 图片生成审批可传；替换本次模型、画幅和质量，重新强校验，不修改提示词、引用或目标。logicalModelId 与
                    channelId + channelModelKey 二选一。
                  required: [ size, quality ]
                  properties:
                    logicalModelId:
                      type: string
                    channelId:
                      type: string
                    channelModelKey:
                      type: string
                    size:
                      type: string
                    quality:
                      type: string
      responses:
        "200":
          description: 信封 data.accepted
        "409":
          description: 审批不存在、已过期或决定冲突
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
  /agent/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [ agent ]
      summary: Agent 运行事件回放与持续订阅
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: |
            首次及 revision 变化时发送紧凑 run_snapshot；无变化时 heartbeat；agent_event.seq 为递增游标，cleanupPending 期间持续发送。
            canvas_updated 的 payload 可含 AgentCanvasUpdatedPayload 中的 undo 凭据。仅无已提交收费任务且有完整快照的普通写入提供非空凭据；缺省或 null 不显示可执行撤销。
          content:
            text/event-stream:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [ meta ]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /auth/console-navigation:
    get:
      tags: [ auth ]
      summary: 以当前个人空间打开 Console 并保留 Studio 返回页面
      description: |
        当前会话重新核验 user_id 与 workspace_id。画布返回页按当前用户核验归属，技能编辑页复用技能可见权限。
        return_path 为带部署前缀的规范路径，允许应用根、已开放静态页面、具体画布或技能编辑页。
        参数必须各出现一次，拒绝额外参数、查询串、片段和编码路径。Provider SDK 核验导航响应后，
        将 ConsolePath 解析到配置的 Console 浏览器源。响应均为 private, no-store，透传会话 Cookie。
      parameters:
        - { in: query, name: user_id, required: true, schema: { type: string } }
        - { in: query, name: workspace_id, required: true, schema: { type: string } }
        - {
            in: query,
            name: destination,
            required: true,
            schema: { type: string, enum: [ account, wallet, usage ] }
          }
        - { in: query, name: return_path, required: true, schema: { type: string } }
      responses:
        "302":
          description: 跳转至经 Provider 核验的 Console 页面
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, enum: [ "private, no-store" ] } }
            Referrer-Policy: { schema: { type: string, enum: [ no-referrer ] } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
