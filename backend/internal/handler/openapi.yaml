                  - code
                  - data
                  - msg
                properties:
                  code:
                    type: integer
                  data: {}
                  msg:
                    type: string
                  reason:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /tasks/preview:
    post:
      summary: 按 Platform 合同预览当前生成请求
      parameters:
        - $ref: "#/components/parameters/StudioIdentityVersion"
        - $ref: "#/components/parameters/StudioActorID"
      responses:
        "200":
          description: Studio 响应信封，业务数据按对应功能合同返回
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - data
                  - msg
                properties:
                  code:
                    type: integer
                  data: {}
                  msg:
                    type: string
                  reason:
                    type: string
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
    StudioIdentityVersion:
      name: X-Studio-Identity-Version
      in: header
      required: true
      schema:
        type: string
        enum:
          - platform-id-v1
    StudioActorID:
      name: X-Studio-Actor-ID
      in: header
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description: 发起动作时的 Platform 用户 ID，必须与当前会话一致
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: header
      name: Cookie
      description: 浏览器携带 Platform 签发的 HttpOnly 会话 Cookie，Studio 原样交给 Platform 校验。
  schemas:
    ThinkingRequest:
      type: string
      enum: [ "", auto, deep, off, minimal, low, medium, high, max ]
      description: 空串或省略等同 auto（模型默认）；deep 取模型支持的最高非 max 档位。具体档位由 Platform 发布的模型能力决定。
    CanvasTextOptions:
      type: object
      properties:
        stream:
          type: boolean
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingRequest"
    CreateTaskRequest:
      type: object
      required: [ type ]
      properties:
        projectId: { type: string }
        commandId: { type: string, description: 用户动作的幂等标识 }
        type: { type: string }
        operation: { type: string }
        prompt: { type: string }
        provider: { type: string }
        model: { type: string }
        logicalModelId: { type: string }
        platform:
          type: object
          properties:
            expectedUserId: { type: string }
            workspaceId: { type: string }
            previewUserId: { type: string }
            previewBinding: { type: string }
            variantId: { type: string }
            expectedCapabilityRevision: { type: string }
            expectedConnectionRevision: { type: integer, format: int64 }
            expectedPriceVersion: { type: string }
            walletMaxPoints: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$' }
            billingPreference: { type: string }
        input:
          type: object
          description: 按任务模式传入创作参数，模型能力、执行授权与费用由 Platform 校验。
          properties:
            mode: { type: string }
            textOptions:
              $ref: "#/components/schemas/CanvasTextOptions"
          additionalProperties: true
    AgentProfileRequest:
      type: object
      additionalProperties: false
      required: [ scope, content, revision ]
      properties:
        scope:
          type: string
          enum: [ user, project, canvas ]
        projectId:
          type: string
        canvasId:
          type: string
        content:
          type: string
          description: 常驻偏好文档，最多 12000 个 Unicode 字符；不能授权节点、工具、预算或绕过审批
        revision:
          type: integer
          minimum: 0
          description: 待更新层的数字 revision；首次创建为 0
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [ prompt, permissionMode, contextScope, idempotencyKey ]
      properties:
        canvasId:
          type: string
          maxLength: 80
          description: 可选。为空时是平台级对话：不占画布锁、只开放无画布工具，contextScope 和 focusNodeIds
            必须为空。续轮可换绑画布，服务端会注入换绑说明。
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [ read_only, request_approval, auto ]
        reasoningMode:
          type: string
          enum: [ off, auto, deep, minimal, low, medium, high, max ]
          description: 本轮思考意图或明确档位；auto 沿用模型默认，deep 取最高非极限档，max 明确选择极限；按实际渠道模型能力归一
        profileRevision:
          type: string
          description: GET /agent/profile 的生效合并 revision；变化时拒绝创建新轮次
        pinnedSkillIds:
          type: array
          maxItems: 16
          items:
            type: string
          description: 用户为对话固定或在本条消息里点名的技能；其余已安装且 agentMode=auto 的技能由 Agent 按技能目录自动发现
        contextScope:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [ canvas ]
        focusNodeIds:
          type: array
          maxItems: 8
          items:
            type: string
          description: 当前焦点节点；前端多选超过 8 个时传前 8 个，剩余数见 focusNodeOmittedCount
        focusNodeOmittedCount:
          type: integer
          minimum: 0
          maximum: 10000
          description: 前端实际选中但未附带的焦点节点数，仅用于提示模型，不授予访问权限
        budget:
          type: object
          additionalProperties: false
          description: Studio 新轮次省略此字段，模型调用按每轮实际用量由 Platform 结算。已有显式限制的请求按原值重放。
          properties:
            maxCredits:
              type: number
              minimum: 0
              maximum: 1000000
              description: Platform 渠道省略或传 0，旧本地计费渠道要求正值。
            maxGenerationTasks:
              type: integer
              minimum: 0
              description: 省略或传 0 表示不限本轮累计生成任务数。
            maxVideoSeconds:
              type: integer
              minimum: 0
              description: 省略或传 0 表示不限本轮累计视频秒数。单次时长由所选模型能力决定。
            maxSteps:
              type: integer
              minimum: 0
              description: 本轮模型调用步数；0表示不设固定步数限制，正数有效上限夹至9999，Go与Pi共用该值
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    Envelope:
      type: object
      required: [ code, msg ]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum:
                [
                  400,
                  401,
                  403,
                  404,
                  409,
                  429,
                  500,
                  502,
                  503,
                  504,
                  40301,
                  40302,
                  40901,
                  42901
                ]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - project_name_conflict
                - skill_version_conflict
                - failed_precondition
                - quota_exceeded
                - storage_capacity_exceeded
                - storage_read_only
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - upstream_dns_failed
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
  responses:
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
