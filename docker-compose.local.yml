services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 PostgreSQL 密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: open-ai-canvas-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      STUDIO_PLATFORM_ORIGIN: ${STUDIO_PLATFORM_ORIGIN:?请配置 Platform Origin}
      STUDIO_PLATFORM_BROWSER_ORIGIN: ${STUDIO_PLATFORM_BROWSER_ORIGIN:-}
      STUDIO_PLATFORM_PRODUCT_KEY: ${STUDIO_PLATFORM_PRODUCT_KEY:?请配置 Studio 产品凭据}
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:?请配置 Studio HTTPS Origin}
      STUDIO_PUBLIC_BASE_PATH: ${STUDIO_PUBLIC_BASE_PATH:-}
      STUDIO_PLATFORM_SESSION_HOSTS: ${STUDIO_PLATFORM_SESSION_HOSTS:?请配置登记的 Session Host}
      STUDIO_PLATFORM_ALLOWED_ORIGINS: ${STUDIO_PLATFORM_ALLOWED_ORIGINS:?请配置登记的 Origin}
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?请配置 PostgreSQL DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      # 服务器访问地址：Agent 看图与生成参考图都靠它签发上游可取到的短时链接。
      CANVAS_PUBLIC_BASE_URL: ${CANVAS_PUBLIC_BASE_URL:-}
      CANVAS_LOG_LEVEL: ${CANVAS_LOG_LEVEL:-info}
      CANVAS_LOG_FORMAT: ${CANVAS_LOG_FORMAT:-text}
      GIN_MODE: release
    volumes:
      - backend-data:/data
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - data/

  web:
    image: open-ai-canvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${STUDIO_PUBLIC_BASE_PATH:-/}
    ports:
      - "3000:3000"
    volumes:
      - web-data:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./web
          ignore:
            - node_modules/
            - dist/
            - tsconfig.tsbuildinfo
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./nginx.conf
        - action: rebuild
          path: ./VERSION
        - action: rebuild
          path: ./CHANGELOG.md

volumes:
  postgres-data:
  redis-data:
  backend-data:
  web-data:
