events { worker_connections 1024; }
http {
    map $http_upgrade $studio_connection {
        default upgrade;
        "" "";
    }
    log_format studio_safe '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log studio_safe;
    server {
        listen 127.0.0.1:8080;
        location = /healthz { return 200 "alive"; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 8444 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 8444 ssl;
        server_name test.oceanway.tech;
        ssl_certificate /etc/letsencrypt/live/test.oceanway.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.oceanway.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1024m;
        add_header Referrer-Policy "no-referrer" always;
        location ~ ^/(v1/(models|images|videos)(/|$)|v1beta/models/|doubao/api/v3/contents/generations/tasks(/|$)) {
            proxy_pass http://45.58.184.2:18420;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name test.oceanway.tech;
        ssl_certificate /etc/letsencrypt/live/test.oceanway.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/test.oceanway.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1024m;
        add_header Referrer-Policy "no-referrer" always;
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $studio_connection;
            proxy_read_timeout 3600s;
        }
    }
}
